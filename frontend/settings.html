<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HearU — Settings</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="hero compact">
        <div class="brand-row">
          <span class="logo-pill">💜 HearU</span>
          <span class="status-pill">Settings</span>
        </div>
        <h1>Privacy & preferences</h1>
      </header>

      <nav class="top-nav">
        <a href="index.html">Home</a>
        <a href="chat.html">Chat</a>
        <a class="active" href="settings.html">Settings</a>
        <a href="profile.html">Profile</a>
      </nav>

      <main class="grid">
        <section class="card">
          <h2>Privacy</h2>
          <label class="toggle"><input type="checkbox" checked /> Remain anonymous</label>
          <label class="toggle"><input type="checkbox" checked /> Hide chat history preview</label>
          <label class="toggle"><input type="checkbox" /> Show profile to support givers</label>
        </section>

        <section class="card">
          <h2>Notifications</h2>
          <label class="toggle"><input type="checkbox" checked /> New message alerts</label>
          <label class="toggle"><input type="checkbox" checked /> Session reminders</label>
          <label class="toggle"><input type="checkbox" /> Weekly wellbeing summary</label>
        </section>

        <section class="card card-wide">
          <h2>Safety tools</h2>
          <p class="muted">Quickly report issues and access urgent resources.</p>
          <div class="actions">
            <button class="btn-danger">Report a conversation</button>
            <button class="btn-secondary">View support resources</button>
          </div>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
