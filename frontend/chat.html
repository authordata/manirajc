<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HearU — Chat</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="hero compact">
        <div class="brand-row">
          <span class="logo-pill">💜 HearU</span>
          <span class="status-pill">Chat</span>
        </div>
        <h1>Conversation room</h1>
      </header>

      <nav class="top-nav">
        <a href="index.html">Home</a>
        <a class="active" href="chat.html">Chat</a>
        <a href="settings.html">Settings</a>
        <a href="profile.html">Profile</a>
      </nav>

      <main class="grid">
        <section class="card card-wide">
          <h2>Start support session</h2>
          <div class="actions">
            <button id="requestHumanBtn" class="btn-secondary">Connect with Support Giver</button>
            <button id="requestAiBtn">Talk to HearU AI</button>
          </div>
          <p id="sessionResult" class="session"></p>
        </section>

        <section class="card card-wide">
          <h2>Live chat</h2>
          <div class="chat-box">
            <pre id="chatOutput">No conversation yet.</pre>
            <div class="chat-row">
              <input id="chatInput" placeholder="Type what's on your mind..." />
              <button id="sendAiMessageBtn">Send</button>
            </div>
          </div>
          <p id="flashMessage" class="flash"></p>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
