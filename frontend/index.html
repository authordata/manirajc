<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Emotional Support Platform</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Your Safe Space for Emotional Support</h1>
      <p>Connect with a human support giver or talk privately with AI.</p>
    </header>

    <main>
      <section class="card">
        <h2>1) Register</h2>
        <input id="email" placeholder="Email" />
        <input id="password" type="password" placeholder="Password" />
        <input id="displayName" placeholder="Display Name" />
        <select id="role">
          <option value="support_seeker">I Need Support</option>
          <option value="support_giver">I Want to Offer Support</option>
        </select>
        <button id="registerBtn">Create Account</button>
      </section>

      <section class="card">
        <h2>2) Login</h2>
        <input id="loginEmail" placeholder="Email" />
        <input id="loginPassword" type="password" placeholder="Password" />
        <button id="loginBtn">Login</button>
      </section>

      <section class="card">
        <h2>3) Dashboard</h2>
        <button id="requestHumanBtn">Connect with Support Giver</button>
        <button id="requestAiBtn">Talk to AI Bot</button>
        <p id="sessionResult"></p>

        <input id="chatInput" placeholder="Type message for AI session" />
        <button id="sendAiMessageBtn">Send to AI</button>
        <pre id="chatOutput"></pre>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
